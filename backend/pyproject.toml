[project]
name = "arbiter-backend"
version = "0.1.0"
description = "Arbiter MCP Gateway: backend API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in default arguments (FastAPI Depends pattern)
    "UP042", # (str, Enum) -> StrEnum changes str()/format() output; not a safe mechanical rewrite
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
# app/ has no __init__.py files (namespace packages); without this mypy stops at
# "Duplicate module named 'cache'" (app/db/models/cache.py vs endpoints/cache.py).
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/db/migrations/*"]

[tool.coverage.report]
skip_empty = true
# Ratchet: 62% at the time CI was added. Raise it as coverage grows; never lower it.
fail_under = 60
