version: 2

# Weekly dependency updates, opened against develop (feature -> develop -> main).
# Minor/patch bumps are grouped per ecosystem to keep PR noise down; majors
# still arrive one per PR so they can be reviewed on their own.
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # Frontend uses pnpm; Dependabot's npm ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions (and their # vX.Y.Z comments) current.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
